name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build Windows exe
        run: go build -ldflags="-s -w" -o codex-ws-proxy.exe .

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item codex-ws-proxy.exe dist\
          Copy-Item README.md dist\
          Copy-Item a.example.json dist\
          Compress-Archive -Path dist\* -DestinationPath codex-ws-proxy-windows-amd64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: codex-ws-proxy-windows-amd64.zip
