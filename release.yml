name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test
        run: go test ./...

      - name: Build Windows exe
        run: go build -ldflags="-s -w" -o codex-ws-proxy.exe .

      - name: Package
        run: |
          mkdir dist
          copy codex-ws-proxy.exe dist\
          copy README.md dist\
          copy a.example.json dist\
          powershell Compress-Archive -Path dist\* -DestinationPath codex-ws-proxy-windows-amd64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: codex-ws-proxy-windows-amd64.zip
